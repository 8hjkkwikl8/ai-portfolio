name: Bug 报告
description: 报告可复现的功能缺陷；演示指标口径问题也请走此模板
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: 所属项目
      options:
        - InsightRAG
        - PromptLens
        - DataChat BI
        - 仓库整体（脚本 / 文档 / CI）
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明缺陷及影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 给出最小复现；核心演示可用 python demo.py，全量验证用 python verify_all.py。
      placeholder: |
        1. 执行命令……
        2. 输入……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 粘贴错误输出或截图；注意脱敏，不要提交 API Key。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 例如 Windows 11 / Python 3.13；Linux / Python 3.13。
      placeholder: OS / Python 版本
    validations:
      required: true
