name: 功能建议
description: 提出新能力或改进；请先说明要解决的问题，而不是直接堆方案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: 所属项目
      options:
        - InsightRAG
        - PromptLens
        - DataChat BI
        - 仓库整体（脚本 / 文档 / CI）
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景与问题
      description: 当前做法有什么不足？为什么值得做？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 说明默认行为是否保持离线可运行；若引入外部服务，必须可选。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 尽量可测试，例如新增的测试数量、产物字段、文档更新点。
      placeholder: |
        - [ ] ……
        - [ ] python verify_all.py 全部通过
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍（可选）
