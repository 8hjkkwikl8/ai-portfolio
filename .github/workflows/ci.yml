name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 96 项测试 + 3 个离线演示；无需任何模型密钥，全程离线。
      # demo 重新生成的产物只用于验证退出码，不会提交。
      - name: Run tests and offline demos
        run: python verify_all.py
        env:
          PYTHONIOENCODING: utf-8
